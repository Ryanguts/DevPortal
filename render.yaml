# Deploy gratuito no Render.com (conecte o repositório GitHub)
# https://render.com — plano Free Web Service
services:
  - type: web
    name: devportal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: r.guts
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
